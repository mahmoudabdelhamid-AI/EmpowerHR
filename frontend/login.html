<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpowerHR - تسجيل الدخول</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Login Section -->
    <section class="registration-section" id="loginSection">
        <div class="registration-container">
            <h2>تسجيل الدخول</h2>

            <div id="loginSuccessMessage" class="hidden" role="status" aria-live="polite" aria-atomic="true"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    required>
                </div>

                <button type="submit" class="submit-btn">تسجيل الدخول</button>

                <div id="loginError" class="hidden" role="alert"></div>
            </form>

            <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>
        </div>
    </section>

    <script>
        window.EMPOWERHR_API_BASE_URL = 'https://backend-psi-neon-83.vercel.app';
    </script>

    <script type="module" src="assets/js/login.js"></script>
</body>
</html>
