<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpowerHR - تسجيل صاحب عمل</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Employer Registration Section -->
    <section class="registration-section" id="employerRegistrationSection">
        <div class="registration-container">
            <h2>تسجيل حساب صاحب عمل</h2>

            <form id="employerRegistrationForm">
                <div class="form-group">
                    <label for="fullName">الاسم الكامل</label>
                    <input type="text" id="fullName" required>
                </div>

                <div class="form-group">
                    <label for="companyName">اسم الشركة</label>
                    <input type="text" id="companyName" required>
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">تأكيد كلمة المرور</label>
                    <input
                    type="password"
                    id="confirmPassword"
                    placeholder="أعد إدخال كلمة المرور"
                    required>
                </div>

                <button type="submit" class="submit-btn">إنشاء حساب صاحب عمل</button>

                <div id="employerRegisterError" class="hidden" role="alert"></div>
            </form>
            <p>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
        </div>
    </section>

    <script type="module" src="assets/js/employer-register.js"></script>
</body>
</html>
